# Copy to secrets.yaml (in the ESPHome config dir) and fill in.
wifi_ssid: "your-ssid"
wifi_password: "your-wifi-password"
ap_password: "fallback-ap-password"
# API encryption key: 32 random bytes, base64 (e.g. `openssl rand -base64 32`).
# The dummy below is base64 of "reterminal-example-key-not-real!", so
# `esphome config` passes on it (ESPHome rejects placeholders and all zeros).
reterminal_key: "cmV0ZXJtaW5hbC1leGFtcGxlLWtleS1ub3QtcmVhbCE="
reterminal_ota_password: "ota-password"
