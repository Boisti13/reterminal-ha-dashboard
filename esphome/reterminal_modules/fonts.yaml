- file: "fonts/Ubuntu-Medium.ttf"
  id: font_header
  size: 28
  glyphs:
    # ASCII
    - " !\"#$%&'()*+,-./0123456789:;<=>?°·"
    - "@ABCDEFGHIJKLMNOPQRSTUVWXYZ[\\]^_"
    - "`abcdefghijklmnopqrstuvwxyz{|}~"
    # German umlauts & sharp S
    - "ÄÖÜäöüß"

