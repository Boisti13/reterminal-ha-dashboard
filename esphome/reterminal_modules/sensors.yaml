# ---------------------------------------------------
# SENSORS
# ---------------------------------------------------

# Internal SHT4x temperature/humidity
- platform: sht4x
  id: sht4x_component
  temperature:
    name: "reTerminal Internal Temperature"
    id: sht4x_temperature
  humidity:
    name: "reTerminal Internal Humidity"
    id: sht4x_humidity
  address: 0x44
  update_interval: 60s

# Battery voltage via ADC
- platform: adc
  pin: GPIO1
  name: "Battery Voltage"
  id: battery_voltage
  update_interval: 600s
  attenuation: 12db
  filters:
    - multiply: 2.0  # compensate divider

# Battery level % derived from battery_voltage (no template sensor component)
- platform: copy
  source_id: battery_voltage
  name: "Battery Level"
  id: battery_level
  device_class: battery
  unit_of_measurement: "%"
  accuracy_decimals: 0
  filters:
    - lambda: |-
        if (isnan(x)) return NAN;

        // LiPo discharge curve (voltage -> %), linear between points
        static const float lut[][2] = {
          {4.20f, 100}, {4.10f, 90}, {4.00f, 80}, {3.92f, 70},
          {3.87f,  60}, {3.82f, 50}, {3.79f, 40}, {3.77f, 30},
          {3.74f,  20}, {3.68f, 10}, {3.45f,  5}, {3.30f,  0},
        };
        const int n = sizeof(lut) / sizeof(lut[0]);

        if (x >= lut[0][0]) return 100.0f;
        if (x <= lut[n - 1][0]) return 0.0f;
        for (int i = 1; i < n; i++) {
          if (x >= lut[i][0]) {
            const float v_hi = lut[i - 1][0], p_hi = lut[i - 1][1];
            const float v_lo = lut[i][0],     p_lo = lut[i][1];
            return p_lo + (x - v_lo) * (p_hi - p_lo) / (v_hi - v_lo);
          }
        }
        return 0.0f;

