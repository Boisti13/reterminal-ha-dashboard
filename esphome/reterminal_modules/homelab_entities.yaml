# ---------------------------------------------------
# HOMELAB (Proxmox Home / RPTU + Pi-hole) for page_homelab
# Merged in via packages: in reterminal.yaml
# ---------------------------------------------------

sensor:
  # ---- Proxmox Home (pve 192.168.178.79) ----
  - platform: homeassistant
    id: pve_home_cpu
    entity_id: sensor.node_pve_cpu_used
  - platform: homeassistant
    id: pve_home_mem
    entity_id: sensor.node_pve_memory_used_percentage
  - platform: homeassistant
    id: pve_home_disk
    entity_id: sensor.node_pve_disk_used_percentage
  - platform: homeassistant
    id: pve_home_vms
    entity_id: sensor.node_pve_virtual_machines_running
  - platform: homeassistant
    id: pve_home_cts
    entity_id: sensor.node_pve_containers_running
  - platform: homeassistant
    id: pve_home_updates
    entity_id: sensor.node_pve_total_updates
  - platform: homeassistant
    id: pve_home_failed
    entity_id: sensor.living_room_node_pve_failed_tasks

  # ---- Proxmox RPTU (pve 192.168.100.103) ----
  - platform: homeassistant
    id: pve_rptu_cpu
    entity_id: sensor.node_pve_cpu_used_2
  - platform: homeassistant
    id: pve_rptu_mem
    entity_id: sensor.node_pve_memory_used_percentage_2
  - platform: homeassistant
    id: pve_rptu_disk
    entity_id: sensor.node_pve_disk_used_percentage_2
  - platform: homeassistant
    id: pve_rptu_vms
    entity_id: sensor.node_pve_virtual_machines_running_2
  - platform: homeassistant
    id: pve_rptu_cts
    entity_id: sensor.node_pve_containers_running_2
  - platform: homeassistant
    id: pve_rptu_updates
    entity_id: sensor.node_pve_total_updates_2
  - platform: homeassistant
    id: pve_rptu_failed
    entity_id: sensor.rptu_node_pve_failed_tasks

  # ---- Pi-hole ----
  - platform: homeassistant
    id: pihole_queries
    entity_id: sensor.pi_hole_dns_queries_today_2
  - platform: homeassistant
    id: pihole_blocked
    entity_id: sensor.pi_hole_ads_blocked_today_2
  - platform: homeassistant
    id: pihole_blocked_pct
    entity_id: sensor.pi_hole_ads_percentage_blocked_today_2
  - platform: homeassistant
    id: pihole_clients
    entity_id: sensor.pi_hole_dns_unique_clients_2
  - platform: homeassistant
    id: pihole_blocklist
    entity_id: sensor.pi_hole_domains_blocked_2

text_sensor:
  - platform: homeassistant
    id: pve_home_boot
    entity_id: sensor.node_pve_last_boot
  - platform: homeassistant
    id: pve_rptu_boot
    entity_id: sensor.node_pve_last_boot_2

