###############################################################################
# reTerminal – Weather helpers (hourly forecast from attribute)
###############################################################################

template:
  - sensor:
      # Optional sanity check – you already have something like this
      - name: "Reterminal Test Sensor"
        unique_id: reterminal_test_sensor
        state: "TEST_OK"

      # --- Hour 0 ---
      - name: "Reterminal Hourly Forecast Line 0"
        unique_id: reterminal_hourly_forecast_line_0
        state: >
          {% set fc = state_attr('sensor.reterminal_weather_hourly', 'forecast') %}
          {% if fc and fc | count > 0 %}
            {% set e = fc[0] %}
            {% set hour = e.datetime[11:13] %}
            {{ hour }}h  {{ e.temperature | float | round(1) }}°C  {{ e.condition }}
          {% else %}
            unavailable
          {% endif %}

